# mic-data-sync 反向代理示例（端口 18080 -> 19090，URL 前缀 /mic-data-sync/）
#
# 使用方式：
#   1. 复制到 /etc/nginx/conf.d/mic-data-sync.conf
#   2. 修改 upstream 中 server 地址（nginx 与客户端不在同一主机时改为内网 IP）
#   3. nginx -t 检查后 reload
#
# 后端必须以 context-path=/mic-data-sync 启动（MIC_SYNC_CONTEXT_PATH=/mic-data-sync），
# 前端构建使用 Vite base /mic-data-sync/，nginx 只做透明转发、不做路径重写。
#
# 重要：必须固定代理到同一个 Sink 实例。不要配置多个 server 做轮询，
# 否则 Sink 身份校验（sinkInstanceId / databaseEpochId）会拒绝批次。

upstream mic-data-sync-pro-bd {
    server 127.0.0.1:19090;
    keepalive 32;
}

server {
    listen 18080;
    server_name _;

    # mic.sync.sink.max-payload-bytes 默认 16MB，JSON 包装后可能略大
    client_max_body_size 32m;

    location = /mic-data-sync {
        return 301 /mic-data-sync/;
    }

    location /mic-data-sync/ {
        proxy_pass http://mic-data-sync-pro-bd;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 大批次直接流式转发，避免在 nginx 临时目录落盘；需配合 HTTP/1.1
        proxy_request_buffering off;
    }
}
