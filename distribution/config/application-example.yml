# mic-data-sync 配置模板（复制为 application.yml 或通过环境变量覆盖）
server:
  # 服务端口（环境变量 MIC_SYNC_SERVER_PORT）
  port: 19090

mic:
  sync:
    # 部署角色：source / sink / source,sink（环境变量 MIC_SYNC_ROLES）
    roles: source,sink
    # 本地数据目录（环境变量 MIC_SYNC_DATA_DIR）
    data-dir: ./data
    # Master Key：默认在 ${dataDir}/secret/master.key 生成；
    # 外部提供用环境变量 MIC_SYNC_MASTER_KEY（Base64 编码 32 字节）
    # master-key: ...

    # 管理员初始化（首次启动时生效，表非空不覆盖；环境变量 MIC_SYNC_ADMIN_PASSWORD）
    admin:
      username: admin
      # password: 由环境变量 MIC_SYNC_ADMIN_PASSWORD 提供

    source:
      # 源侧最大任务数（环境变量 MIC_SYNC_SOURCE_MAX_TASKS）
      max-tasks: 10
      # 全局最大活动 Run（环境变量 MIC_SYNC_SOURCE_MAX_ACTIVE_RUNS）
      max-active-runs: 1
      # Source 访问 Sink 的访问令牌（环境变量 MIC_SYNC_SINK_TOKEN）
      # sink-token: ...

    sink:
      # 单批最大行数与负载大小
      max-rows-per-batch: 1000
      max-payload-bytes: 16777216
      # HTTPS 显式跳过 TLS 校验（高风险，默认关闭；环境变量 MIC_SYNC_SINK_TLS_INSECURE_SKIP_VERIFY）
      tls-insecure-skip-verify: false

# 数据库连接（通过 Web UI 配置后加密存储，不在模板中保存明文密码）
# Sink Token：通过 Web UI（系统设置）生成/轮换，或环境变量 MIC_SYNC_SINK_TOKEN
